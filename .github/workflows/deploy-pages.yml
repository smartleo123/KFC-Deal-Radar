name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate website
        run: |
          test -s index.html
          test -s app.js
          test -s style.css
          node --check app.js
          node tests/smoke.cjs
      - name: Download fresh KCouper coupon snapshot
        run: |
          mkdir -p _site
          cp index.html app.js style.css .nojekyll _site/
          python3 scripts/sync_data.py _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website and latest snapshot
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
