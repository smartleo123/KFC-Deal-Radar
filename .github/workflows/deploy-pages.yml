name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate website
        run: |
          test -s index.html
          test -s app.js
          test -s style.css
          node --check app.js
          node tests/smoke.cjs
          python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Download fresh KCouper coupon snapshot
        run: |
          mkdir -p _site
          cp index.html app.js style.css favicon.svg .nojekyll _site/
          mkdir -p _site/data
          if [ -f data/official.json ]; then cp data/official.json _site/data/official.json; fi
          if [ -f data/singles.json ]; then cp data/singles.json _site/data/singles.json; fi
          # KCouper remains a clearly labeled fallback while official data expands.
          python3 scripts/sync_data.py _site
          python3 scripts/stamp_assets.py _site/index.html "$GITHUB_SHA"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website and latest snapshot
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published Pages site and official data
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/check_live.py
