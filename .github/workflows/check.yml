name: Website checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Run smoke tests
        run: node tests/smoke.cjs
      - name: Install browser DOM test dependency
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Run real DOM rendering tests
        run: node tests/browser.cjs
