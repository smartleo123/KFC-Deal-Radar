name: Collect KFC official API data

on:
  push:
    branches: [main]
    paths:
      - "scripts/collect_official.py"
      - "tests/test_collector.py"
      - ".github/workflows/collect-official.yml"
  schedule:
    - cron: "9 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: official-kfc-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test coupon collection and snapshot fallback
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Query KFC Taiwan ordering endpoints (bounded incremental scan)
        env:
          KFC_MAX_CHECKS: "35"
          KFC_REQUEST_DELAY: "0.8"
          KFC_SCAN_MARGIN: "2000"
        run: python3 scripts/collect_official.py --out data
      - name: Validate collector output
        run: |
          python3 -m py_compile scripts/collect_official.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/official.json')
          if p.exists():
              data=json.loads(p.read_text(encoding='utf-8'))
              assert isinstance(data['coupon_list'],list)
              assert data['count']==len(data['coupon_list'])
              assert all(c['source']=='kfc_api_verified' for c in data['coupon_list'])
              print('Verified coupons:',data['count'])
          PY
      - name: Persist verified data for the next scan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No official data changes"
          else
            git commit -m "data: update KFC API verified coupons and menu prices"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  deploy:
    concurrency:
      group: pages
      cancel-in-progress: false
    needs: collect
    runs-on: ubuntu-latest
    if: success()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout newly persisted verified data
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Build static site with official data
        run: |
          mkdir -p _site/data
          cp index.html app.js style.css favicon.svg .nojekyll _site/
          if [ -f data/official.json ]; then cp data/official.json _site/data/official.json; fi
          if [ -f data/singles.json ]; then cp data/singles.json _site/data/singles.json; fi
          python3 scripts/sync_data.py _site
          python3 scripts/stamp_assets.py _site/index.html "$GITHUB_SHA"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy collected data to Pages
        id: deployment
        uses: actions/deploy-pages@v4
